<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — Human Mirror</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="hm-header"></div>

  <section class="section" style="padding-top: 140px;">
    <div class="container">
      <div style="max-width: 650px; margin: 0 auto; text-align: center;" class="reveal">
        <h2 style="font-size: 38px; margin-bottom: 16px;">Communications Central</h2>
        <p style="color:var(--muted); font-weight:300; margin-bottom:40px;">Have structural framework architecture inquiries? Connect securely below.</p>
        
        <div id="contactSuccess" style="display:none; background:var(--green-pale); border:1px solid var(--green-mid); border-radius:var(--radius); padding:32px; flex-direction:column; align-items:center; gap:16px;">
          <span style="font-size:36px;">✉️</span>
          <h3 style="color:var(--green);">Message Processed Securely</h3>
          <p style="font-size:14px; color:var(--muted); font-weight:300;">Transmission dispatched via sandboxed framework successfully.</p>
        </div>

        <form id="contactForm" style="background:#fff; border:1px solid var(--border); padding:40px; border-radius:var(--radius); box-shadow:var(--shadow-soft);">
          <div class="form-group">
            <label class="form-label">Identity Reference / Name</label>
            <input type="text" class="form-input" required placeholder="John Doe">
          </div>
          <div class="form-group">
            <label class="form-label">Electronic Mail Link</label>
            <input type="email" class="form-input" required placeholder="john@domain.org">
          </div>
          <div class="form-group">
            <label class="form-label">Inquiry Core Details</label>
            <textarea class="form-textarea" required style="min-height: 120px;" placeholder="Describe how we can coordinate architectural parameters..."></textarea>
          </div>
          <button type="submit" class="btn btn-green" style="width: 100%; justify-content: center;">Transmit Dispatch</button>
        </form>
      </div>
    </div>
  </section>

  <div id="hm-footer"></div>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
